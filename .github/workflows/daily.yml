name: Daily FNXNT image

on:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      fnxnt_version:
        description: 'Optional FNXNT version override'
        required: false
        default: ''

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: dgcosenza/fnxnt

jobs:
  public-check:
    name: Public content check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify public-content rules and attribution
        env:
          PR_TEXT: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
        run: .github/scripts/public-check.sh

  hadolint:
    name: Hadolint Dockerfile lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          VER="8.30.1"
          SHA="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSLo /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          rm -f /tmp/gitleaks /tmp/gitleaks.tar.gz
      - name: Scan
        shell: bash
        run: gitleaks git --verbose --redact --no-banner

  build:
    name: Build and scan
    needs: [public-check, hadolint, gitleaks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Determine version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          V=$(grep -m1 '^ARG FNXNT_VERSION=' Dockerfile | cut -d= -f2 | tr -d ' "')
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          IMG="${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}-${{ matrix.arch }}"
          docker run --rm "$IMG" ip link show lo
          docker run --rm --user netuser --workdir /home/netuser "$IMG" whoami
          docker run --rm "$IMG" fnxnt-motd >/dev/null
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}-${{ matrix.arch }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Grype scan
        uses: anchore/grype-action@v0.14.0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}-${{ matrix.arch }}
          fail-on: high
          only-fixed: true

  publish:
    name: Publish multi-arch image
    needs: [build]
    if: github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          V=$(grep -m1 '^ARG FNXNT_VERSION=' Dockerfile | cut -d= -f2 | tr -d ' "')
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Build and push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.date }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
      - name: Cosign sign
        uses: sigstore/cosign-installer@v3
      - name: Sign image
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes ${{ env.IMAGE_NAME }}:latest || true
      - name: Sync Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: README.md
          short-description: ${{ env.DOCKERHUB_SHORT_DESCRIPTION }}
        env:
          DOCKERHUB_SHORT_DESCRIPTION: FNXNT: production-hardened multi-arch network diagnostics toolbox.
